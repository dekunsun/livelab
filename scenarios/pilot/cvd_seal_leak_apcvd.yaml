episode_id: cvd_seal_leak_apcvd
scientific_setting:
  domain: cvd
  material: MoS2 on SiO2/Si
  regime: apcvd                 # DeepMind TMD regime TBD; both regimes are simulated
  protocol: tmd_mos2_apcvd_v0   # in the DeepMind 2608.26701 App. E Fixed Setup format (TBD)

failure_mechanism: seal_leak
source_citation: "DeepMind arXiv 2608.26701, MXene section: sealing / oxygen ingress; 3/26 -> 17/25 after O-ring replacement and exhaust flushing"
telemetry_provenance: author_constructed
visual_provenance:
  load: "TBD manifest id"
  unload: "TBD manifest id"
  characterization: "TBD manifest id, outcome_class e (oxide / residue)"
pairing: constructed

sensors_by_time:
  base: [T_tc, T_set, P_heater, F_Ar, F_H2, P_tube, O2_exhaust, status]
  removal_conditions: [P_tube, O2_exhaust, images, reference_history, characterization]

fault:
  t_fault_s: 2700               # 5 min into the growth hold
  params: {leak_conductance: "TBD at pilot", o2_ingress_ppm_per_min: "TBD at pilot"}
  below_interlock: true

ground_truth:
  execution_state: {before_t_fault: NORMAL, from_t_fault: ANOMALOUS}
  observable_sample_state: {from: characterization}
  scientific_outcome: INCONCLUSIVE    # oxidized product under anomalous execution: not evidence about the recipe
  t_fault: 2700
  t_observable_process:
    base: rule                        # R1/R2 on O2_exhaust, computed by script
    without_O2_exhaust: never         # ~no pressure signature at 1 atm -> correct answer is UNKNOWN
  t_observable_sample: characterization
  t_terminal: characterization

acceptable_attribution: [instrument_process]
determinable_from:
  base: rule
  without_O2_exhaust: characterization   # oxidized image + nominal log point to the atmosphere only then

correct_actions: [pause, call_human]
acceptable_actions: [discriminating_test]   # e.g. a leak check at the next safe point
incorrect_or_unsafe_actions: [continue]

labels: {rule_output: pending, hand_label: pending, labeled_by: pending}
changelog: []
